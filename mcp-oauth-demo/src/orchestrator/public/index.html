<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCP + OAuth 2.1 デモ — Chat UI</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f4f7;
        --panel: #ffffff;
        --border: #e3e6ea;
        --text: #1b1f24;
        --muted: #6b7280;
        --accent: #2f6df6;
        --ok: #16a34a;
        --warn: #d97706;
        --err: #dc2626;
        --code: #f6f7f9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121418;
          --panel: #1a1d22;
          --border: #2b2f36;
          --text: #e7eaee;
          --muted: #9aa3af;
          --code: #232830;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      header h1 { font-size: 15px; margin: 0; }
      header .meta { font-size: 11.5px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
      .setting { display: flex; align-items: center; gap: 7px; }
      .setting label { font-size: 12px; color: var(--muted); }
      .setting select {
        font-size: 12.5px; padding: 5px 8px; border-radius: 7px;
        border: 1px solid var(--border); background: var(--bg); color: var(--text);
      }
      .badge {
        font-size: 11px; border-radius: 999px; padding: 3px 9px; border: 1px solid;
      }
      .badge.trusted { color: var(--ok); border-color: var(--ok); }
      .badge.untrusted { color: var(--err); border-color: var(--err); }
      header button {
        margin-left: auto; border: 1px solid var(--border); background: transparent;
        color: var(--muted); border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer;
      }
      main { flex: 1; display: grid; grid-template-columns: 1fr 440px; min-height: 0; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } #flow { display: none; } }

      #chat { display: flex; flex-direction: column; min-height: 0; }
      #messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
      .msg { max-width: 76%; padding: 12px 15px; border-radius: 13px; line-height: 1.75; white-space: pre-wrap; font-size: 14px; }
      .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
      .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
      .msg.system { align-self: center; font-size: 12px; color: var(--muted); background: transparent; }

      .elicitation {
        align-self: flex-start; max-width: 76%; border: 1px solid var(--accent);
        border-radius: 13px; padding: 16px; background: color-mix(in srgb, var(--accent) 7%, var(--panel));
      }
      .elicitation .tag {
        display: inline-block; font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase;
        color: var(--accent); border: 1px solid var(--accent); border-radius: 5px; padding: 2px 6px; margin-bottom: 9px;
      }
      .elicitation p { margin: 0 0 12px; font-size: 14px; line-height: 1.7; }
      .elicitation a {
        display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
        padding: 9px 16px; border-radius: 8px; font-size: 13.5px;
      }
      .elicitation code { display: block; margin-top: 10px; font-size: 10.5px; color: var(--muted); word-break: break-all; }

      form { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border); background: var(--panel); }
      input[type="text"] {
        flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
        background: var(--bg); color: var(--text); font-size: 14px;
      }
      form button { padding: 0 20px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }
      form button:disabled { opacity: .5; cursor: default; }

      #flow { border-left: 1px solid var(--border); background: var(--panel); overflow-y: auto; padding: 16px 18px; }
      #flow h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 14px; }
      .entry { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
      .no {
        font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #fff; background: var(--muted);
        border-radius: 6px; height: 21px; display: grid; place-items: center;
      }
      .entry.ok .no { background: var(--ok); }
      .entry.warn .no { background: var(--warn); }
      .entry.error .no { background: var(--err); }
      .entry .t { font-size: 13px; }
      .entry .d { font-size: 11.5px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; word-break: break-all; margin-top: 3px; line-height: 1.6; }
      .hint { font-size: 12px; color: var(--muted); line-height: 1.8; }
      .hint code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <header>
      <h1>MCP + OAuth 2.1 デモ</h1>

      <div class="setting">
        <label for="orchestrator">オーケストレーター</label>
        <select id="orchestrator"></select>
        <span class="badge" id="trust">…</span>
      </div>

      <span class="meta" id="meta">…</span>
      <button id="reset" type="button">トークン破棄</button>
    </header>

    <main>
      <section id="chat">
        <div id="messages">
          <div class="msg system intro">
            プロンプトを送ると、LLM が MCP サーバーの hello ツール呼び出しを指示し、
            OAuth 2.1 の認可フローが始まります。例:「太郎さんに挨拶して」
          </div>
        </div>
        <form id="form">
          <input id="prompt" type="text" placeholder="例: 太郎さんに挨拶して" autocomplete="off" />
          <button type="submit">送信</button>
        </form>
      </section>

      <aside id="flow">
        <h2>フロー (図の番号に対応)</h2>
        <div id="entries"></div>
        <p class="hint" style="margin-top: 16px">
          6〜8 (CIMD 確認 / 返却 / クライアント登録) は MCP Server・Client registry・
          Authorization Server 間で行われます。ターミナルの
          <code>[mcp]</code> <code>[registry]</code> <code>[auth]</code> のログを見てください。
        </p>
      </aside>
    </main>

    <script type="module">
      const messages = document.getElementById('messages');
      const entries = document.getElementById('entries');
      const form = document.getElementById('form');
      const input = document.getElementById('prompt');
      const submit = form.querySelector('button');

      const select = document.getElementById('orchestrator');
      const trustBadge = document.getElementById('trust');

      const sessionId =
        sessionStorage.getItem('sessionId') ??
        (() => {
          const id = crypto.randomUUID();
          sessionStorage.setItem('sessionId', id);
          return id;
        })();

      // どのオーケストレーターを使うかは設定として localStorage に残す
      let profiles = [];
      let current = localStorage.getItem('orchestratorVariant') ?? 'trusted';
      let events = null;
      let config = null;

      const profile = () => profiles.find((p) => p.variant === current) ?? profiles[0];
      const api = (path) => `${profile().base}${path}`;

      function addMessage(role, content) {
        const el = document.createElement('div');
        el.className = `msg ${role}`;
        el.textContent = content;
        messages.appendChild(el);
        messages.scrollTop = messages.scrollHeight;
        return el;
      }

      let elicitationEl = null;

      function addElicitation({ message, url }) {
        elicitationEl?.remove();
        const el = document.createElement('div');
        el.className = 'elicitation';
        el.innerHTML = `
          <span class="tag">elicitation / url mode</span>
          <p></p>
          <a target="_blank" rel="noopener">ブラウザで認可する</a>
          <code></code>`;
        el.querySelector('p').textContent = message;
        el.querySelector('a').href = url;
        el.querySelector('code').textContent = url;
        messages.appendChild(el);
        messages.scrollTop = messages.scrollHeight;
        elicitationEl = el;
      }

      function addFlow({ step, title, detail, level }) {
        const el = document.createElement('div');
        el.className = `entry ${level ?? 'info'}`;
        el.innerHTML = '<div class="no"></div><div><div class="t"></div><div class="d"></div></div>';
        el.querySelector('.no').textContent = step ?? '·';
        el.querySelector('.t').textContent = title;
        el.querySelector('.d').textContent = detail ?? '';
        entries.appendChild(el);
        entries.parentElement.scrollTop = entries.parentElement.scrollHeight;
      }

      /** 選択中のオーケストレーターに SSE で繋ぎ直す。 */
      function connect() {
        events?.close();
        elicitationEl = null;
        // 画面は接続先の履歴で作り直す (サーバー側が再送してくれる)
        messages.querySelectorAll('.msg:not(.intro), .elicitation').forEach((el) => el.remove());
        entries.replaceChildren();

        events = new EventSource(api(`/api/events?session=${encodeURIComponent(sessionId)}`));
        events.addEventListener('flow', (e) => addFlow(JSON.parse(e.data)));
        events.addEventListener('message', (e) => {
          const { role, content } = JSON.parse(e.data);
          addMessage(role, content);
          // 応答が返ってきたら再び入力できるようにする
          if (role !== 'user') submit.disabled = false;
        });
        events.addEventListener('elicitation', (e) => {
          const { params } = JSON.parse(e.data);
          addElicitation(params);
        });
        events.addEventListener('elicitation-done', () => {
          elicitationEl?.remove();
          elicitationEl = null;
        });
      }

      function render() {
        const p = profile();
        const untrusted = p.variant === 'untrusted';
        select.value = p.variant;
        trustBadge.textContent = untrusted ? '未登録' : '登録済み';
        trustBadge.className = `badge ${p.variant}`;
        trustBadge.title = p.description;
        document.getElementById('meta').textContent =
          `client_id=${p.clientId}  resource=${config.resource}  AS=${config.authorizationServer}`;
      }

      async function init() {
        config = await fetch('/api/config').then((r) => r.json());
        profiles = config.orchestrators;
        if (!profiles.some((p) => p.variant === current)) current = profiles[0].variant;

        select.replaceChildren(
          ...profiles.map((p) => {
            const opt = document.createElement('option');
            opt.value = p.variant;
            opt.textContent = `${p.label} (${new URL(p.base).port})`;
            return opt;
          }),
        );
        render();
        connect();
      }

      select.addEventListener('change', () => {
        current = select.value;
        localStorage.setItem('orchestratorVariant', current);
        submit.disabled = false;
        render();
        connect();
        addMessage(
          'system',
          `オーケストレーターを「${profile().label}」に切り替えました (client_id=${profile().clientId})`,
        );
      });

      // Enter で送信する。日本語入力の変換確定 (isComposing) では送信しない。
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const prompt = input.value.trim();
        if (!prompt) return;
        input.value = '';
        submit.disabled = true;
        // (1) プロンプト指示 → (2) 起動
        // 画面への反映はサーバーからの SSE に任せる (認可でページを離れても復元できる)
        await fetch(api('/api/chat'), {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ sessionId, prompt }),
        });
      });

      document.getElementById('reset').addEventListener('click', async () => {
        await fetch(api('/api/reset'), {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ sessionId }),
        });
        addMessage('system', 'アクセストークンを破棄しました。次の送信で認可フローがやり直されます。');
      });

      await init();
    </script>
  </body>
</html>
